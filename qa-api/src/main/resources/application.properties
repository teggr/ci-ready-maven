spring.application.name=ci-ready-maven-qa-api
spring.ai.openai.api-key=${CI_READY_MAVEN_OPENAI_API_KEY:}
spring.ai.openai.chat.model=${CI_READY_MAVEN_MODEL:gpt-5-mini}
spring.ai.openai.chat.max-completion-tokens=${QA_MAX_OUTPUT_TOKENS:4000}
spring.ai.openai.chat.store=false
spring.ai.openai.chat.timeout=${QA_PROVIDER_TIMEOUT:25s}
spring.ai.openai.chat.response-format.type=JSON_OBJECT

qa.assistant.max-question-length=${QA_MAX_QUESTION_LENGTH:1000}
qa.assistant.retrieval-limit=${QA_RETRIEVAL_LIMIT:5}
qa.assistant.minimum-evidence-score=${QA_MINIMUM_EVIDENCE_SCORE:3.5}
qa.assistant.max-context-characters=${QA_MAX_CONTEXT_CHARACTERS:12000}
qa.assistant.max-answer-characters=${QA_MAX_ANSWER_CHARACTERS:4000}
qa.assistant.model-timeout-seconds=${QA_MODEL_TIMEOUT_SECONDS:30}
qa.assistant.max-concurrent-model-calls=${QA_MAX_CONCURRENT_MODEL_CALLS:4}
qa.assistant.model-queue-capacity=${QA_MODEL_QUEUE_CAPACITY:8}
qa.api.max-request-body-bytes=${QA_MAX_REQUEST_BODY_BYTES:16384}
qa.api.requests-per-window=${QA_REQUESTS_PER_WINDOW:30}
qa.api.rate-limit-window-seconds=${QA_RATE_LIMIT_WINDOW_SECONDS:60}
qa.api.cors-allowed-origin=${QA_CORS_ALLOWED_ORIGIN:https://teggr.github.io}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
server.error.include-message=never
server.error.include-stacktrace=never
