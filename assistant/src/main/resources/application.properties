spring.application.name=CatalogueAssistant
spring.ai.model.chat=${ASSISTANT_CHAT_PROVIDER:none}
spring.ai.openai.api-key=${ASSISTANT_API_KEY:}
spring.ai.openai.base-url=${ASSISTANT_API_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${ASSISTANT_MODEL:}
spring.ai.openai.chat.temperature=0
spring.ai.openai.chat.max-tokens=${ci-ready-maven.assistant.max-answer-tokens:600}
spring.ai.openai.max-retries=0
spring.ai.openai.chat.max-retries=0
spring.ai.openai.timeout=${ci-ready-maven.assistant.read-timeout-millis:20000}ms
spring.ai.openai.chat.timeout=${ci-ready-maven.assistant.read-timeout-millis:20000}ms
ci-ready-maven.assistant.enabled=${ASSISTANT_ENABLED:false}
server.forward-headers-strategy=none
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
server.tomcat.connection-timeout=10s
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.tools.observations.include-content=false
logging.level.org.springframework.ai=OFF
logging.level.org.springframework.web.client=OFF
logging.level.com.openai=OFF
logging.level.okhttp3=OFF
