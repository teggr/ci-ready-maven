name: Build and Deploy Site

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # build job
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Build site with JBang
        run: |
          jbang --fresh site.electrostatic:electrostatic-cli:0.0.3 build

      - name: Build and test assistant and catalogue snapshot
        run: ./assistant/mvnw -B -f assistant/pom.xml verify

      - name: Publish versioned catalogue snapshot
        run: |
          mkdir -p generated-site/catalogue
          cp assistant/target/classes/catalogue.json "generated-site/catalogue/${GITHUB_SHA}.json"

      - name: Upload artifact
        # Automatically uploads an artifact from the './generated-site' directory
        uses: actions/upload-pages-artifact@v5
        with:
          path: './generated-site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
